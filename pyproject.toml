[project]
name = "ilias-mcp"
version = "0.1.0"
description = "MCP-Server für ILIAS (HHN, Uni Mannheim) und Moodle (HS Mannheim): Login, Session-Status, Kurse, Kursinhalte."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "ilias-mcp" }]
keywords = ["mcp", "model-context-protocol", "ilias", "moodle", "lms"]
dependencies = [
    "mcp>=1.9.0,<2",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "beautifulsoup4>=4.12",
    "keyring>=25.0",
    "pydantic>=2.6",
    "pyotp>=2.8",  # ILIAS HHN: TOTP-Code für Keycloak-Login
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]

[project.scripts]
ilias-mcp = "ilias_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ilias_mcp", "src/ilias_mcp_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
