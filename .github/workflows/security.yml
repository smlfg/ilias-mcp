# SEC-CI-1: no pull_request_target. Jobs that need no secrets run on every PR
# (including forks / model runs). CodeQL uses the default GitHub token only.
name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (SEC-5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          ver=8.30.1
          sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          echo "${sha}  /tmp/gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan
        run: gitleaks detect --source . --verbose --redact --exit-code 1

  pii-guard:
    name: pii-guard (SEC-11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No e-mail addresses / Matrikelnummern except .pii-allowlist
        run: python3 scripts/pii_guard.py

  pip-audit:
    name: pip-audit (SEC-6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Export lock and audit
        run: |
          set -euo pipefail
          uv export --format requirements-txt --no-emit-project --no-dev --no-hashes \
            --no-emit-package ilias-cli -o /tmp/reqs.txt
          # Drop VCS / editable / git lines; keep environment markers.
          python - <<'PY'
          from pathlib import Path
          out = []
          for line in Path("/tmp/reqs.txt").read_text().splitlines():
              line = line.strip()
              if not line or line.startswith("#") or line.startswith("-e ") or " @ " in line or line.startswith("git+"):
                  continue
              out.append(line)
          Path("/tmp/pinned.txt").write_text("\n".join(out) + "\n")
          PY
          uvx "pip-audit==2.10.1" -r /tmp/pinned.txt --strict

  bandit:
    name: bandit (SEC-6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Run bandit
        run: uvx "bandit==1.9.4" -r src -ll

  codeql:
    name: CodeQL (SEC-6)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:python"
